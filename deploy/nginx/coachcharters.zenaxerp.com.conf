# Nginx config template for:
# - Next.js frontend (Node) on main domain
# - Laravel backend (PHP-FPM) mounted on /api/v1 and /storage
#
# IMPORTANT:
# 1) Update paths and PHP socket/version before using.
# 2) Keep /api/v1 on Laravel, and leave /api/* (other than v1) to Next.js
#    so Next route /api/chat continues to work.

upstream coachcharters_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name coachcharters.zenaxerp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coachcharters.zenaxerp.com;

    # SSL certs (replace with your real paths or CloudPanel managed certs)
    ssl_certificate     /etc/ssl/certs/coachcharters.zenaxerp.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/coachcharters.zenaxerp.com/privkey.pem;

    # Backend public root for Laravel mounted paths
    # Change this to your actual backend/public path
    root /var/www/coachcharters.zenaxerp.com/backend/public;

    client_max_body_size 20m;

    # ------------------------------------------------------------
    # Laravel static storage files
    # ------------------------------------------------------------
    location ^~ /storage/ {
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------------
    # Laravel API only on /api/v1
    # ------------------------------------------------------------
    location ^~ /api/v1/ {
        try_files $uri /index.php?$query_string;
    }

    # Handle PHP only for Laravel mounted routes
    location ~ ^/(index\.php|api/v1/.*)$ {
        include fastcgi_params;

        # If your distro uses socket, use this:
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # If your stack uses tcp fpm port:
        fastcgi_pass 127.0.0.1:9000;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_intercept_errors off;
    }

    # Deny direct access to arbitrary php files
    location ~ \.php$ {
        return 404;
    }

    # ------------------------------------------------------------
    # Next.js app for everything else
    # ------------------------------------------------------------
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;

        proxy_pass http://coachcharters_next;
    }
}
